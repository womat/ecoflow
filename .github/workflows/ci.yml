# Actions are pinned to a commit SHA, with the release in a comment: a tag like
# @v7 can be moved to other code, a SHA cannot. dependabot (.github/dependabot.yml)
# proposes updates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'ed:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

      # govulncheck reports known vulnerabilities in the Go version and the modules
      # that the code actually calls. dependabot does not see go install lines -
      # raise the version by hand.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The go test above compares the go output against these golden files.
      # Nothing was checking the other half of the promise - that the python
      # decoder still produces them - so a change there could quietly drift
      # apart from the service until someone regenerated a golden by hand.
      - name: the python decoder still produces the golden files
        run: |
          for capture in fast slow damaged; do
            python3 scripts/ecoflow-frames.py \
              < internal/frames/testdata/$capture.txt > /tmp/$capture.out
            diff -u internal/frames/testdata/$capture.golden /tmp/$capture.out
          done

      # Checks the signature assembly against EcoFlow's published test vector
      # and the stream switch frame against the captured bytes. No network.
      - run: scripts/ecoflow-api.sh selftest
