# Keeps the Go modules and the SHA-pinned GitHub Actions current. The workflows pin
# every action to a commit SHA with the release in a comment; dependabot updates
# both together. govulncheck and golangci-lint are installed with `go install` by
# `make lint` (pinned in the Makefile), which dependabot does not see - raise those
# pins by hand.

version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # "chore(deps): …", the "type(scope): description" convention the release changelog
      # groups on.
      prefix: "chore(deps)"
    groups:
      go:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # "chore(ci): …" - an action only changes the workflows, not the binary.
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  # The base images in the Dockerfile. golang:1.27-alpine already follows the
  # patch releases; this proposes the next minor.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # "chore(deps): …" like the Go modules - a base image goes into the released image.
      prefix: "chore(deps)"
