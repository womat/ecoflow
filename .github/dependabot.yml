# Keeps the Go modules and the SHA-pinned GitHub Actions current. The workflows pin
# every action to a commit SHA with the release in a comment; dependabot updates
# both together. govulncheck is installed with `go install` in the workflows,
# which dependabot does not see - raise that version by hand.

version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # The base images in the Dockerfile. golang:1.27-alpine already follows the
  # patch releases; this proposes the next minor.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
