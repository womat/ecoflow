# GoReleaser configuration for ecoflowd.
#
# A release is created by pushing a semver tag:
#
#   make release TAG=v0.7.0
#
# .github/workflows/release.yml then runs `goreleaser release --clean`, and
# afterwards builds the container image from the Dockerfile. To try the
# archives out locally without publishing:
#
#   make snapshot
version: 2

project_name: ecoflowd

before:
  hooks:
    - go mod download

builds:
  # ecoflowd is a service and only useful on Linux in practice; macOS and
  # Windows are built all the same, for trying it out on a laptop.
  #
  # Raspberry Pi compatibility:
  #   arm64 -> Pi 3/4/5/Zero 2 W with a 64-bit OS
  #   armv7 -> Pi 2/3/4/5/Zero 2 W with a 32-bit OS
  #   armv6 -> Pi 1 and Zero (1st gen)
  - id: ecoflowd
    main: ./cmd/ecoflowd
    binary: ecoflowd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      # .Tag keeps the v prefix, so a release binary reports the same string
      # as before GoReleaser and as `go install …@v0.7.0` does.
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: ecoflowd
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    # The unit travels with the binary, so a systemd install needs nothing
    # from the repository.
    files:
      - README.md
      - LICENSE
      - contrib/ecoflowd@.service

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge branch"
      - "^Merge pull request"
  groups:
    - title: Features
      regexp: '(?i)^feat(\(.*\))?[:(]'
      order: 0
    - title: Bug fixes
      regexp: '(?i)^(fix|bugfix)(\(.*\))?[:(]'
      order: 1
    - title: Documentation
      regexp: '(?i)^(docu|docs)(\(.*\))?[:(]'
      order: 2
    - title: Maintenance
      regexp: '(?i)^(chore|refactor)(\(.*\))?[:(]'
      order: 3
    - title: Other
      order: 99

release:
  draft: false
  prerelease: auto
  footer: |
    ## Docker

    `docker pull ghcr.io/womat/ecoflowd:{{ .Version }}` – for `linux/amd64`, `linux/arm64`,
    `linux/arm/v7` and `linux/arm/v6`; see "Quick start: Docker" in the README.

    ## Which file do I need?

    | Archive | Machine |
    |---|---|
    | `linux_arm64`  | Raspberry Pi 3 / 4 / 5 / Zero 2 W with a 64-bit OS |
    | `linux_armv7`  | Raspberry Pi 2 / 3 / 4 / 5 / Zero 2 W with a 32-bit OS |
    | `linux_armv6`  | Raspberry Pi 1 and Zero (1st gen) |
    | `linux_amd64`  | ordinary Linux PC/server, NAS |
    | `darwin_arm64` | Mac with Apple Silicon |
    | `darwin_amd64` | Mac with Intel |
    | `windows_amd64` (zip) | Windows |

    Each archive holds `ecoflowd`, the systemd unit `contrib/ecoflowd@.service`,
    `README.md` and `LICENSE`. Check the download against `checksums.txt`:
    `sha256sum -c checksums.txt --ignore-missing`
