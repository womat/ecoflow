# Builds and publishes a GitHub release whenever a semver tag is pushed.
#
#   make release TAG=v0.7.0
#
# The tag is the single source of truth for the version: GoReleaser injects it
# into main.version via -ldflags, so the binary always reports the tag it was cut from.
#
# Before anything is published the tagged commit is tested, vetted and scanned
# again: a release must not depend on whether the CI run of that commit passed.
# Actions are pinned to a commit SHA, with the release in a comment; see ci.yml.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GoReleaser creates the release and uploads the archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the full history to build the changelog

      # Releases are cut from main only. `make release` enforces this locally, but
      # a hand-made `git tag` bypasses it, so the workflow refuses to publish a
      # tag whose commit never reached main.
      - name: Verify the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main. Push the commit to main first, then re-tag."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      # stable rather than go.mod's minimum on purpose: standard library
      # security fixes reach a release through the toolchain it is built with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      - run: go vet ./...
      - run: go test -race ./...

      # Known vulnerabilities are checked again on the tagged commit, as in ci.yml;
      # dependabot does not see go install lines - raise the version by hand.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The container image, from the same tagged commit and only once the job
  # above has tested and published it. The Dockerfile cross-compiles in its
  # build stage, so the four platforms need no emulation.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # v0.7.0 becomes 0.7.0, 0.7 and latest. No major-only tag while the
      # number starts with 0: there every minor may break.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ecoflowd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # The repository's license alone (MIT) would understate what the image
          # contains: it links Paho (EPL-2.0, or EDL-1.0 = BSD-3-Clause),
          # gorilla/websocket (BSD-2-Clause) and golang.org/x (BSD-3-Clause).
          # See "Third-party licenses" in the README.
          labels: |
            org.opencontainers.image.licenses=MIT AND BSD-2-Clause AND BSD-3-Clause AND (EPL-2.0 OR BSD-3-Clause)
            org.opencontainers.image.description=Live readings from an EcoFlow PowerOcean on your local MQTT broker

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
