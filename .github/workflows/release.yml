# Actions are pinned to a commit SHA, with the release in a comment; see ci.yml.
name: release

on:
  push:
    tags: ["v*"]

# Go cross-compiles, so one Linux runner builds every target.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      # The tag is only released once the same checks CI runs have passed, so
      # no untested binary can be published.
      - run: go vet ./...
      - run: go test ./...

      # Known vulnerabilities are checked again on the tagged commit, as in ci.yml;
      # dependabot does not see go install lines - raise the version by hand.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Each command ships as its own archive. ecoflowd is a service and
          # only useful on Linux in practice, but it is built everywhere all
          # the same: this stays one loop over targets instead of a loop over
          # targets with exceptions, and a darwin build is handy for trying it
          # out on a laptop.
          for cmd in ecoflowd
          do
            for target in \
              linux/amd64 linux/arm64 linux/arm \
              darwin/arm64 darwin/amd64 \
              windows/amd64
            do
              os=${target%/*}
              arch=${target#*/}
              name="${cmd}-${VERSION}-${os}-${arch}"
              bin="${cmd}"
              if [ "$os" = "windows" ]; then bin="${cmd}.exe"; fi

              # GOARM=6 keeps the 32-bit build usable on every Raspberry Pi,
              # including the ARMv6 models; it is ignored for other targets.
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=6 \
                go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/${bin}" "./cmd/${cmd}"

              tar -czf "dist/${name}.tar.gz" -C dist "${bin}"
              rm "dist/${bin}"
            done
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
